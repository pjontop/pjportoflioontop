name: Deploy portfolio

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Upload and activate release
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: deploy
        run: |
          release="/home/deploy/releases/${GITHUB_SHA}"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release'"
          rsync -az --delete -e 'ssh -o BatchMode=yes -o IdentitiesOnly=yes' dist/ "$DEPLOY_USER@$DEPLOY_HOST:$release/"
          ssh -o BatchMode=yes -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" "ln -sfn '$release' /home/deploy/portfolio-current"

      - name: Verify deployment
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://pramsu.dev/ > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://pramsu.dev/robots.txt > /dev/null
          curl --fail --silent --show-error --retry 5 --retry-delay 2 https://pramsu.dev/sitemap-index.xml > /dev/null
